<!doctype html>
<html lang="en" data-theme="rose" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fdf2f5" />
    <!-- iOS PWA chrome: standalone display + a translucent status bar so the
         page's own (theme-tinted) background shows through, since iOS only
         offers "default" (dark text) or "black-translucent" (light text,
         see-through) — there's no per-theme text-color hook beyond that. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Us" />
    <title>Us ❤</title>
    <link rel="manifest" id="app-manifest" href="/manifest.webmanifest" />
    <link rel="icon" id="app-favicon" href="/icon.svg" />
    <link rel="apple-touch-icon" id="app-apple-touch-icon" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
