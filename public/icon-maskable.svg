    d="M12 21s-1-.7-3.2-2.6C5.9 15.4 3 12.9 3 9.5 3 7 5 5 7.5 5c1.6 0 3.1.8 4.5 2.6C13.4 5.8 14.9 5 16.5 5 19 5 21 7 21 9.5c0 3.4-2.9 5.9-5.8 8.9C13 20.3 12 21 12 21z"
    fill="#fff7f9"
    transform="translate(28, 30) scale(2.05)"
  />
</svg>
