<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- maskable icon: full-bleed background (the OS applies its own crop
       shape), artwork kept inside the ~80% safe-zone circle so it survives
       circular/rounded-square/squircle masks on any platform. Static brand
       color — unlike the in-app favicon (see tintFavicon in
       composables/themeColors.js), a manifest icon is read once at install
       time and can't be retinted live afterward. -->
